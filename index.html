<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReelCut｜画面収録をCM風デモ動画に</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&family=Noto+Serif+JP:wght@500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0f1218">
  <script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
  <script>
    window.addEventListener("error", function (e) {
      try {
        var box = document.getElementById("boot-error");
        if (!box) {
          box = document.createElement("div");
          box.id = "boot-error";
          box.style.cssText = "position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;border-radius:10px;padding:12px;font:12px/1.5 monospace;white-space:pre-wrap;max-height:40vh;overflow:auto";
          document.body.appendChild(box);
        }
        box.textContent += "⚠ " + (e.message || e) + "\n  at " + (e.filename || "").split("/").pop() + ":" + e.lineno + ":" + e.colno + "\n";
      } catch (x) {}
    });
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">🎬</span><span class="brand-name">ReelCut</span><span class="brand-sub">画面収録を、CM風デモ動画に</span></div>
    <div class="spacer"></div>
    <span id="save-badge" class="badge">保存済み</span>
    <button id="btn-export-tab" class="btn btn-primary">⬇ 書き出し</button>
  </header>

  <div class="proj-tabs" id="proj-tabs"></div>
  <div id="storage-banner" class="storage-banner hidden"></div>

  <main class="layout">
    <section class="stage" id="stage">
      <div class="canvas-wrap" id="canvas-wrap">
        <canvas id="preview"></canvas>
        <div id="stage-empty" class="stage-empty">
          <div class="big">🎬</div>
          <div>右の「クリップ」から画面収録（.mov / .mp4）を追加するか、ここにドラッグ＆ドロップ</div>
          <div class="small">オープニングは動画がなくてもプレビューできます（▶ を押してみてください）</div>
        </div>
        <div id="export-overlay" class="export-overlay hidden"></div>
      </div>

      <div class="controls">
        <button id="btn-play" class="btn btn-primary btn-icon" title="再生 / 一時停止（スペース）">▶</button>
        <button id="btn-start" class="btn btn-icon" title="最初へ">⏮</button>
        <span id="time-label" class="time">0:00 / 0:00</span>
        <span class="spacer"></span>
        <span id="phase-label" class="chip">—</span>
      </div>

      <div class="timeline" id="timeline">
        <div class="tl-block" id="tl-open" title="オープニング（クリックでプレビュー）">OP</div>
        <div class="tl-track" id="tl-track">
          <div class="tl-clips" id="tl-clips"></div>
          <div class="tl-ranges" id="tl-ranges"></div>
          <div class="tl-inserts" id="tl-inserts"></div>
          <div class="tl-selection hidden" id="tl-selection"></div>
          <div class="tl-ghost hidden" id="tl-ghost"></div>
          <div class="tl-playhead" id="tl-playhead"></div>
        </div>
        <div class="tl-block" id="tl-end" title="エンディング（クリックでプレビュー）">ED</div>
      </div>
      <div class="tl-hint" id="tl-hint">クリック：その時点へ　｜　<b>ダブルクリックしてそのままドラッグ</b>：範囲を選んで「字幕 / 倍速 / カット」　｜　範囲をクリック：編集</div>
      <div id="place-bar" class="place-bar hidden"></div>

      <div id="range-popover" class="popover hidden"></div>
      <div id="range-list" class="range-list"></div>
      <div id="insert-list" class="range-list"></div>
    </section>

    <aside class="side">
      <div class="tabs" id="tabs">
        <button class="active" data-tab="opening">🎞 オープニング</button>
        <button data-tab="clips">📹 クリップ</button>
        <button data-tab="embed">🧩 埋め込み</button>
        <button data-tab="ending">🔚 エンディング</button>
        <button data-tab="export">⬇ 書き出し</button>
      </div>
      <div id="panel" class="panel"></div>
    </aside>
  </main>

  <div id="toast" class="toast hidden"></div>
  <div id="style-picker" class="picker hidden"></div>
  <div id="slide-fs" class="slide-fs hidden"></div>
  <input type="file" id="file-video" accept="video/*,.mov,.mp4,.webm,.m4v" multiple class="hidden">
  <input type="file" id="file-image" accept="image/*" multiple class="hidden">
  <input type="file" id="file-backup" accept=".rcpk" class="hidden">

  <script src="js/store.js"></script>
  <script src="js/opening.js"></script>
  <script src="js/timeline.js"></script>
  <script src="js/inserts.js"></script>
  <script src="js/render.js"></script>
  <script src="js/export.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
